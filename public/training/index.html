<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B2B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AD Training">
<title>Venapunctie Training · Aedes Dei Academy</title>
<link rel="icon" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F8F6F2;--beige:#E9DFD2;--sand:#EFE8DD;--gold:#B99A6B;--gold-l:#D9C6A5;--gold-d:#8F7146;--navy:#25394B;--navy-d:#1B2B3A;--taupe:#8C7B6B;--ink:#2F3337;--line:#E2D7C6;--ok:#4E8A5E;--bad:#B5584A;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7E1D8}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.serif{font-family:"Cormorant Garamond",serif}
#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--cream);position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(37,57,75,.12)}
@media(min-width:520px){body{padding:24px 0}#app{min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden}}
.scr{flex:1;overflow-y:auto;padding-bottom:calc(84px + var(--safe-b))}
.scr.full{padding-bottom:0}
/* top */
.top{background:var(--navy-d);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 22px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-30px;width:220px;height:300px;border:1px solid rgba(217,198,165,.25);border-radius:110px 110px 0 0;pointer-events:none}
.top .row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:46px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid rgba(217,198,165,.25);padding:5px 10px;border-radius:99px;font-weight:600;font-size:13px;color:var(--gold-l)}
.chip svg{width:15px;height:15px}
.top h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:34px;line-height:1.05;margin:18px 0 4px;position:relative;z-index:1}
.top h1 em{color:var(--gold-l)}
.top p{margin:0;color:#CFC6B8;font-size:14px;position:relative;z-index:1}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:16px;position:relative;z-index:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E3C891);border-radius:9px;transition:width .6s}
.bar.lt{background:var(--beige)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--gold-l);margin-top:7px;position:relative;z-index:1;letter-spacing:.04em}
/* path */
.path{padding:26px 0 30px;position:relative}
.unit{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.node{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .15s}
.node:active{transform:scale(.94)}
.node .core{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.node svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.node.open .core{background:linear-gradient(160deg,#CDAF7C,var(--gold-d));color:#fff}
.node.done .core{background:var(--navy);color:var(--gold-l)}
.node.lock .core{background:#DDD5C9;color:#A79C8E;box-shadow:0 5px 0 #CFC5B7}
.node.cur::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.ulabel{margin-top:10px;text-align:center;max-width:200px}
.ulabel b{display:block;font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:600;color:var(--navy);line-height:1.15}
.ulabel span{font-size:12px;color:var(--taupe)}
.start{position:absolute;top:-34px;background:var(--navy);color:#fff;font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 10px;border-radius:8px;white-space:nowrap}
.start::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--navy)}
.conn{width:2px;height:34px;margin:8px auto;background:repeating-linear-gradient(var(--gold-l) 0 5px,transparent 5px 10px)}
.final{margin:12px 20px 0;padding:20px;border-radius:22px;background:var(--navy);color:#fff;display:flex;gap:14px;align-items:center}
.final .ic{width:52px;height:52px;border-radius:16px;background:rgba(217,198,165,.15);display:grid;place-items:center;flex:none}
.final b{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600;display:block;line-height:1.1}
.final span{font-size:13px;color:#CFC6B8}
/* tabbar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(248,246,242,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + var(--safe-b));z-index:20}
@media(min-width:520px){.tabs{bottom:24px;border-radius:0 0 28px 28px}}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#A39788;padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--navy)}
.tabs button.on svg{color:var(--gold-d)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(27,43,58,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:460px;transform:translate(-50%,105%);background:var(--cream);border-radius:26px 26px 0 0;z-index:31;transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(24px + var(--safe-b));max-height:86vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--beige);margin:0 auto 14px}
.sheet h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:28px;margin:2px 0 2px;color:var(--navy);line-height:1.1}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.list{margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);text-align:left;width:100%}
.li .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sand);color:var(--gold-d);font-weight:700}
.li.ok .dot{background:var(--ok);color:#fff}
.li.lk{opacity:.5}
.li b{display:block;font-weight:600;color:var(--navy)}
.li span{font-size:12.5px;color:var(--taupe)}
.li .go{margin-left:auto;color:var(--gold-d)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:16px;font-weight:700;font-size:15px;letter-spacing:.02em;background:var(--navy);color:#fff;box-shadow:0 4px 0 #0F1C28;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0F1C28}
.btn.gold{background:linear-gradient(160deg,#C9A970,var(--gold-d));box-shadow:0 4px 0 #6E5432}
.btn.gold:active{box-shadow:0 1px 0 #6E5432}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);box-shadow:0 4px 0 var(--beige)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #346343}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 #8A3F34}
.btn[disabled]{background:#D7CFC3;color:#fff;box-shadow:0 4px 0 #C4BBAE;pointer-events:none}
/* player */
.ph{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px;position:sticky;top:0;background:var(--cream);z-index:5}
.ph .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--taupe)}
.ph .bar{flex:1;margin:0;background:var(--beige);height:12px}
.ph .bar i{background:linear-gradient(90deg,var(--gold),#D8B87C)}
.ph .cnt{font-size:13px;font-weight:700;color:var(--gold-d);min-width:38px;text-align:right}
.card{margin:6px 18px 0;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.card .kick{margin-bottom:6px}
.card h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:31px;line-height:1.08;color:var(--navy);margin:0 0 14px}
.card .img{border-radius:20px;overflow:hidden;margin:0 0 16px;background:#fff;border:1px solid var(--line)}
.card .img img{width:100%;display:block;max-height:250px;object-fit:contain}
.card .body{font-size:16px;line-height:1.6}
.card .body p{margin:0 0 12px}
.card .body ul,.card .body ol{margin:0 0 12px;padding-left:20px}
.card .body li{margin-bottom:7px}
.card .body ol li::marker{color:var(--gold-d);font-weight:700}
.card .body ul li::marker{color:var(--gold)}
.card .body b{color:var(--navy)}
.card .body dl{margin:0 0 12px;border-top:1px solid var(--line)}
.card .body dt{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:18px;color:var(--navy);padding-top:10px}
.card .body dd{margin:0;padding:1px 0 10px;border-bottom:1px solid var(--line);color:#4E5257;font-size:15px}
.card .note{background:var(--sand);border-radius:14px;padding:12px 14px;font-size:14.5px;color:#5B4E40}
.stats{display:flex;gap:10px;margin:2px 0 14px}
.stats div{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.stats b{display:block;font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:600;line-height:1;color:var(--navy)}
.stats span{font-size:12px;color:var(--taupe);line-height:1.3;display:block;margin-top:4px}
.tubes{list-style:none;padding:0!important}
.tubes li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);margin:0!important}
.tubes i{width:16px;height:16px;border-radius:50%;flex:none;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.foot{position:sticky;bottom:0;padding:16px 18px calc(16px + var(--safe-b));background:linear-gradient(180deg,rgba(248,246,242,0),var(--cream) 30%)}
/* quiz */
.q{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:27px;line-height:1.15;color:var(--navy);margin:2px 0 20px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:15.5px;font-weight:500;transition:border-color .15s,background .15s}
.opt .k{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--taupe);flex:none}
.opt.sel{border-color:var(--gold);background:#FBF6EC;box-shadow:0 3px 0 var(--gold-l)}
.opt.sel .k{border-color:var(--gold);color:var(--gold-d)}
.opt.right{border-color:var(--ok);background:#EDF5EE;box-shadow:0 3px 0 #BCD8C2}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FAEDEA;box-shadow:0 3px 0 #E5C2BB}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:460px;padding:18px 18px calc(18px + var(--safe-b));z-index:25;transition:transform .28s cubic-bezier(.2,.8,.2,1);border-radius:22px 22px 0 0}
.fb.on{transform:translate(-50%,0)}
.fb.good{background:#E4F0E6}.fb.nope{background:#F7E5E1}
.fb h3{margin:0 0 4px;font-size:19px;display:flex;gap:8px;align-items:center}
.fb.good h3{color:var(--ok)}.fb.nope h3{color:var(--bad)}
.fb p{margin:0 0 14px;font-size:14.5px;color:#4A4540}
/* result */
.res{text-align:center;padding:calc(40px + env(safe-area-inset-top,0px)) 24px 30px}
.res .medal{width:130px;height:130px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F1DDB0,var(--gold) 55%,var(--gold-d));box-shadow:0 14px 30px -10px rgba(143,113,70,.7);color:#fff;font-family:"Cormorant Garamond",serif;font-size:44px;font-weight:600;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.res .medal.fail{background:radial-gradient(circle at 35% 30%,#E9E2D8,#B9AE9F 60%,#8C7B6B)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.res h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:34px;color:var(--navy);margin:0 0 6px;line-height:1.1}
.res p{color:var(--taupe);margin:0 0 22px}
.kpis{display:flex;gap:10px;margin:0 0 24px}
.kpis div{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px}
.kpis b{display:block;font-family:"Cormorant Garamond",serif;font-size:28px;color:var(--navy);line-height:1}
.kpis span{font-size:11.5px;color:var(--taupe);letter-spacing:.04em}
.review{text-align:left;margin:0 0 18px}
.review .it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.review .it b{color:var(--navy);display:block;margin-bottom:3px}
.review .it .a{color:var(--ok);font-weight:600}
.review .it .y{color:var(--bad)}
/* sections */
.sec{padding:22px 20px 0}
.sec h3{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:22px;color:var(--navy);margin:0 0 12px}
.tile{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:#fff;border:1px solid var(--line);margin-bottom:12px;width:100%;text-align:left}
.tile .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--sand);color:var(--gold-d)}
.tile.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.tile.dark .ic{background:rgba(217,198,165,.15);color:var(--gold-l)}
.tile b{display:block;font-size:16px;font-weight:700}
.tile span{font-size:13px;color:var(--taupe)}
.tile.dark span{color:#CFC6B8}
.tile .go{margin-left:auto;opacity:.6}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);font-size:13px;background:var(--sand);padding:4px 9px;border-radius:9px}
.empty{color:var(--taupe);font-size:14px;padding:6px 0 0}
.mods .m{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.mods .m .n{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--gold);width:28px}
.mods .m b{font-weight:600;color:var(--navy);font-size:14.5px;display:block}
.mods .m .bar{margin:5px 0 0;height:6px}
.mods .m em{font-style:normal;font-size:12px;color:var(--taupe);margin-left:auto;white-space:nowrap}
.hist .h{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.pill.p{background:#E4F0E6;color:var(--ok)}.pill.f{background:#F7E5E1;color:var(--bad)}
.cert{margin:0 20px;padding:22px;border-radius:22px;background:var(--navy-d);color:#fff;text-align:center;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;left:50%;top:14px;width:150px;height:190px;margin-left:-75px;border:1px solid rgba(217,198,165,.35);border-radius:75px 75px 0 0}
.cert *{position:relative}
.cert b{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:500;display:block}
.cert span{color:var(--gold-l);font-size:13px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-140%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:50;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="content.js"></script>
<script src="content-en.js"></script>

// helpers on progress
function lessonDone(mi,li){return !!S.lessons[C[mi].id+'-'+li];}
function lessonsDone(mi){return C[mi].lessons.every(function(_,li){return lessonDone(mi,li)});}
function modDone(mi){return !!S.done[C[mi].id];}
function unlocked(mi){return mi===0||modDone(mi-1);}
function modPct(mi){var m=C[mi],tot=m.lessons.length+1,d=m.lessons.filter(function(_,li){return lessonDone(mi,li)}).length+(modDone(mi)?1:0);return d/tot;}
function totalPct(){var t=0;C.forEach(function(_,i){t+=modPct(i)});return t/C.length;}
function allQ(){var a=[];C.forEach(function(m,mi){m.quiz.forEach(function(q,qi){a.push(Object.assign({id:m.id+'-'+qi,mod:mi},q))})});return a;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

// ---------- quiz engine ----------
// mode: mod (module test) | exam (timed, feedback at end) | practice (10 random) | wrong (mistakes)
function startQuiz(mode,mi){
  closeSheet();var qs;
  if(mode==='mod')qs=C[mi].quiz.map(function(q,qi){return Object.assign({id:C[mi].id+'-'+qi,mod:mi},q)});
  else if(mode==='exam')qs=shuffle(allQ()).slice(0,EXAM_N);
  else if(mode==='practice')qs=shuffle(allQ()).slice(0,10);
  else{var w=S.wrong;qs=allQ().filter(function(q){return w[q.id]});if(!qs.length){toast(L('Geen fouten om te oefenen 🎉'));return;}qs=shuffle(qs).slice(0,15);}
  qs=qs.map(function(q){var order=shuffle(q.a.map(function(_,k){return k}));return Object.assign({},q,{order:order})});
  var i=0,answers=[],sel=null,locked=false,end=mode==='exam'?Date.now()+EXAM_MIN*60000:0, instant=mode!=='exam';
  var title={mod:L('Moduletoets ')+ROM[mi],exam:L('Eindexamen'),practice:L('Oefenen'),wrong:L('Foutenbank')}[mode];
  function tick(){var t=app.querySelector('.timer');if(!t)return;var s=Math.max(0,Math.round((end-Date.now())/1000));t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s<=0){clearInterval(timerId);finish(true);}}
  function draw(){var q=qs[i];sel=null;locked=false;
    app.innerHTML='<div class="scr full"><div class="ph"><button class="x" data-x>'+ICO.x+'</button><div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div>'+(end?'<span class="timer">--:--</span>':'<span class="cnt">'+(i+1)+'/'+qs.length+'</span>')+'</div>'+
     '<div class="card"><div class="kick">'+title+(end?L(' · vraag ')+(i+1)+L(' van ')+qs.length:'')+'</div><div class="q">'+esc(q.q)+'</div><div class="opts">'+
     q.order.map(function(k,n){return '<button class="opt" data-k="'+k+'"><span class="k">'+'ABCD'[n]+'</span><span>'+esc(q.a[k])+'</span></button>'}).join('')+'</div></div>'+
     '<div class="foot"><button class="btn" data-check disabled>'+(instant?L('Controleren'):(i<qs.length-1?L('Volgende'):L('Inleveren')))+'</button></div></div><div class="fb" id="fb"></div>';
    app.querySelector('[data-x]').onclick=function(){if(confirmLeave())home();};
    app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(locked)return;app.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel')});b.classList.add('sel');sel=+b.dataset.k;app.querySelector('[data-check]').disabled=false;}});
    app.querySelector('[data-check]').onclick=check;
    if(end){tick();}
  }
  function confirmLeave(){return true;}
  function check(){if(sel===null||locked)return;var q=qs[i],ok=sel===q.c;answers.push({q:q,sel:sel,ok:ok});
    if(ok){if(S.wrong[q.id]){delete S.wrong[q.id];}}else S.wrong[q.id]=(S.wrong[q.id]||0)+1;save();
    if(!instant){next();return;}
    locked=true;
    app.querySelectorAll('.opt').forEach(function(o){var k=+o.dataset.k;if(k===q.c)o.classList.add('right');else if(k===sel)o.classList.add('wrong');o.classList.remove('sel');});
    var fb=document.getElementById('fb');fb.className='fb on '+(ok?'good':'nope');
    fb.innerHTML='<h3>'+(ok?ICO.check+' '+[L('Goed zo!'),L('Uitstekend!'),L('Helemaal juist!'),L('Top!')][Math.floor(Math.random()*4)]:ICO.x+L(' Niet helemaal'))+'</h3><p>'+(ok?'':L('Juist antwoord: <b>')+esc(q.a[q.c])+'</b>. ')+esc(q.e)+'</p><button class="btn '+(ok?'ok':'bad')+'" data-n>'+(i<qs.length-1?L('Doorgaan'):L('Bekijk resultaat'))+'</button>';
    fb.querySelector('[data-n]').onclick=next;
  }
  function next(){i++;if(i<qs.length)draw();else finish(false);}
  function finish(timeout){clearInterval(timerId);
    qs.slice(answers.length).forEach(function(q){answers.push({q:q,sel:null,ok:false})});
    var score=answers.filter(function(a){return a.ok}).length,n=qs.length,pass=score/n>=PASS;
    var xp=score*XP_Q/(mode==='mod'&&modDone(mi)?2:1);addXP(Math.round(xp));
    var newly=false;
    if(mode==='mod'){var id=C[mi].id;S.best[id]=Math.max(S.best[id]||0,score);if(pass&&!S.done[id]){S.done[id]=1;newly=true;}}
    if(mode==='exam')S.exams.unshift({d:new Date().toLocaleDateString(S.lang==='en'?'en-GB':'nl-NL'),s:score,n:n,p:pass});
    save();
    var msg=mode==='mod'?(pass?(newly?'Module '+ROM[mi]+L(' afgerond! ')+(mi<C.length-1?'Module '+ROM[mi+1]+L(' is nu open.'):L('Je kunt nu het eindexamen doen.')):L('Weer geslaagd voor deze module.')):L('Je hebt ')+Math.ceil(n*PASS)+L(' goed nodig. Lees de lessen nog eens en probeer opnieuw.'))
      :mode==='exam'?(timeout?L('De tijd is om. '):'')+(pass?L('Gefeliciteerd, je bent geslaagd voor het eindexamen!'):L('Nog niet geslaagd: je hebt ')+Math.ceil(n*PASS)+L(' goed nodig.')):L('Fouten komen in je foutenbank, zodat je ze later kunt herhalen.');
    var wrong=answers.filter(function(a){return !a.ok});
    app.innerHTML='<div class="scr full"><div class="res"><div class="medal'+(pass||mode==='practice'||mode==='wrong'?'':' fail')+'">'+score+'/'+n+'</div>'+
      '<h2>'+(pass?(mode==='exam'?L('Geslaagd!'):L('Goed gedaan!')):(mode==='exam'||mode==='mod')?L('Bijna!'):L('Klaar!'))+'</h2><p>'+msg+'</p>'+
      '<div class="kpis"><div><b>'+Math.round(score/n*100)+L('%</b><span>SCORE</span></div><div><b>+')+Math.round(xp)+'</b><span>XP</span></div><div><b>'+S.streak.n+L('</b><span>REEKS</span></div></div>')+
      (wrong.length?L('<div class="review"><div class="kick" style="margin-bottom:8px">Nakijken</div>')+wrong.map(function(a){return '<div class="it"><b>'+esc(a.q.q)+'</b>'+(a.sel!=null?L('<span class="y">Jouw antwoord: ')+esc(a.q.a[a.sel])+'</span><br>':L('<span class="y">Niet beantwoord</span><br>'))+L('<span class="a">Juist: ')+esc(a.q.a[a.q.c])+'</span><div style="color:var(--taupe);margin-top:3px">'+esc(a.q.e)+'</div></div>'}).join('')+'</div>':'')+
      (mode==='mod'&&!pass?L('<button class="btn gold" data-r>Opnieuw proberen</button><div style="height:10px"></div>'):'')+
      (mode==='mod'&&pass&&mi<C.length-1?L('<button class="btn gold" data-nm>Naar module ')+ROM[mi+1]+'</button><div style="height:10px"></div>':'')+
      (mode==='exam'&&!pass?L('<button class="btn gold" data-r>Examen opnieuw</button><div style="height:10px"></div>'):'')+
      L('<button class="btn ghost" data-h>Terug naar overzicht</button></div></div>');
    if(pass)confetti();
    var r=app.querySelector('[data-r]');if(r)r.onclick=function(){startQuiz(mode,mi)};
    var nm=app.querySelector('[data-nm]');if(nm)nm.onclick=function(){tab='leren';home();openModule(mi+1);};
    app.querySelector('[data-h]').onclick=function(){if(mode==='exam'||mode==='practice'||mode==='wrong')tab='toets';home();};
  }
  draw();if(end){timerId=setInterval(tick,1000);}
}
// ---------- test tab ----------
function vTest(){
  var wn=Object.keys(S.wrong).length, last=S.exams[0];
  app.innerHTML='<div class="scr"><header class="top"><div class="row"><div class="brand"><img src="img/logo.png" alt=""></div>'+chips()+L('</div><h1>Test <em>jezelf</em></h1><p>Zoals een theorie-examen: oefen tot je het zeker weet.</p></header>')+
   '<div class="sec"><button class="tile dark" data-m="exam"><span class="ic">'+ICO.trophy+L('</span><span><b>Eindexamen</b><span>')+EXAM_N+L(' willekeurige vragen · ')+EXAM_MIN+L(' min · ')+Math.round(PASS*100)+L('% om te slagen</span></span><span class="go">')+ICO.chev+'</span></button>'+
   '<button class="tile" data-m="practice"><span class="ic">'+ICO.bolt+L('</span><span><b>Snel oefenen</b><span>10 willekeurige vragen met direct uitleg</span></span><span class="go">')+ICO.chev+'</span></button>'+
   '<button class="tile" data-m="wrong"><span class="ic">'+ICO.redo+L('</span><span><b>Foutenbank</b><span>')+(wn?wn+' '+(S.lang==='en'?(wn>1?'questions':'question')+' to repeat':(wn>1?'vragen':'vraag')+' om te herhalen'):L('Nog geen fouten. Goed bezig!'))+'</span></span><span class="go">'+ICO.chev+'</span></button></div>'+
   L('<div class="sec"><h3>Per module</h3>')+C.map(function(m,mi){return '<button class="tile" data-mod="'+mi+'" style="padding:12px 14px'+(lessonsDone(mi)?'':';opacity:.55')+'"><span class="ic" style="width:40px;height:40px;font-family:Cormorant Garamond,serif;font-size:19px;font-weight:600">'+ROM[mi]+'</span><span><b style="font-size:15px">'+esc(m.t)+'</b><span>'+(S.best[m.id]!=null?L('Beste: ')+S.best[m.id]+'/'+m.quiz.length:m.quiz.length+L(' vragen'))+(lessonsDone(mi)?'':L(' · eerst de lessen'))+'</span></span><span class="go">'+(modDone(mi)?'<span style="color:var(--ok)">'+ICO.check+'</span>':ICO.chev)+'</span></button>'}).join('')+'</div>'+
   (last?L('<div class="sec"><h3>Laatste examens</h3><div class="hist">')+S.exams.slice(0,5).map(function(e){return '<div class="h"><span>'+e.d+'</span><span>'+e.s+'/'+e.n+' &nbsp;<span class="pill '+(e.p?'p">Geslaagd':L('f">Niet geslaagd'))+'</span></span></div>'}).join('')+'</div></div>':'')+
   '<div style="height:20px"></div></div>'+tabs();
  app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){startQuiz(b.dataset.m)}});
  app.querySelectorAll('[data-mod]').forEach(function(b){b.onclick=function(){var mi=+b.dataset.mod;if(!lessonsDone(mi)){toast(L('Rond eerst de lessen van module ')+ROM[mi]+' af');return;}startQuiz('mod',mi)}});
}
// ---------- me tab ----------
function vMe(){
  var nd=C.filter(function(_,i){return modDone(i)}).length, passed=S.exams.some(function(e){return e.p}), tq=allQ().length;
  app.innerHTML='<div class="scr"><header class="top"><div class="row"><div class="brand"><img src="img/logo.png" alt=""></div>'+chips()+L('</div><h1>Jouw <em>voortgang</em></h1><p>')+(S.name?esc(S.name)+' · ':'')+Math.round(totalPct()*100)+L('% van de training voltooid</p></header>')+
   '<div class="sec"><div class="kpis"><div><b>'+nd+'/'+C.length+L('</b><span>MODULES</span></div><div><b>')+S.xp+'</b><span>XP</span></div><div><b>'+S.streak.n+L('</b><span>DAGEN REEKS</span></div></div></div>')+
   (passed&&nd===C.length?'<div class="cert"><div style="color:var(--gold-l);margin-bottom:6px">'+ICO.trophy+L('</div><span>AEDES DEI ACADEMY</span><b>Training venapunctie<br>theorie voltooid</b><span>')+(S.name?esc(S.name)+' · ':'')+S.exams.find(function(e){return e.p}).d+'</span></div>':'')+
   L('<div class="sec"><h3>Modules</h3><div class="mods">')+C.map(function(m,mi){return '<div class="m"><span class="n">'+ROM[mi]+'</span><span style="flex:1"><b>'+esc(m.t)+'</b><div class="bar lt"><i style="width:'+Math.round(modPct(mi)*100)+'%"></i></div></span><em>'+(modDone(mi)?L('✓ Klaar'):Math.round(modPct(mi)*100)+'%')+'</em></div>'}).join('')+'</div></div>'+
   L('<div class="sec"><h3>Instellingen</h3><button class="tile" data-name><span class="ic">')+ICO.me+L('</span><span><b>Jouw naam</b><span>')+(S.name?esc(S.name):L('Voor op je certificaat'))+'</span></span><span class="go">'+ICO.chev+'</span></button>'+
   '<button class="tile" data-reset><span class="ic" style="color:var(--bad)">'+ICO.redo+L('</span><span><b>Voortgang wissen</b><span>Opnieuw beginnen op dit apparaat</span></span></button>')+
   L('<p class="empty">Je voortgang wordt op dit apparaat bewaard. ')+tq+L(' oefenvragen in ')+C.length+L(' modules. Gebaseerd op het Cursusboek Venapunctie, editie 2026.</p></div><div style="height:20px"></div></div>')+tabs();
  app.querySelector('[data-name]').onclick=function(){var sh=document.getElementById('sheet');sh.innerHTML=L('<div class="grab"></div><div class="kick">Certificaat</div><h2>Jouw naam</h2><input id="nm" maxlength="60" style="width:100%;font:inherit;font-size:16px;padding:14px;border-radius:14px;border:1px solid var(--line);margin:14px 0" placeholder="Voor- en achternaam"><button class="btn gold" id="nmok">Opslaan</button>');sh.querySelector('#nm').value=S.name||'';openSheet();sh.querySelector('#nmok').onclick=function(){S.name=sh.querySelector('#nm').value.trim().slice(0,60);save();closeSheet();vMe();bindTabs();};};
  var rs=app.querySelector('[data-reset]');rs.onclick=function(){if(!rs._armed){rs._armed=1;toast(L('Tik nogmaals om alles te wissen'));setTimeout(function(){rs._armed=0},3000);return;}try{localStorage.removeItem(KEY);}catch(e){}S=load();vMe();bindTabs();toast(L('Voortgang gewist'));};
}
// ---------- confetti ----------
function confetti(){var c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);var x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){c.remove();return;}
  var P=[],cols=['#B99A6B','#D9C6A5','#25394B','#E3C891','#8F7146'];for(var i=0;i<110;i++)P.push({x:W/2,y:H/3,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,r:Math.random()*6+3,c:cols[i%5],a:Math.random()*6});
  var t=0;(function f(){x.clearRect(0,0,W,H);P.forEach(function(p){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});if(++t<120)requestAnimationFrame(f);else c.remove();})();}
home();
})();
</script>
